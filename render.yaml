services:
  - name: pokego-cards-api
    type: web
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGINS
        sync: false
      - key: MYSQL_URL
        sync: false

  - name: pokego-cards-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FRONTEND_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
