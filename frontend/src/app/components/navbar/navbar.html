<header class="navbar">
  <a class="brand" routerLink="/inicio">
    <span class="brand-icon">TCG</span>
    <span>PokeGo Cards</span>
  </a>

  <nav class="nav-links" aria-label="Navegacion principal">
    <a routerLink="/inicio" routerLinkActive="active">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active">Catalogo</a>
    <a routerLink="/agregar-producto" routerLinkActive="active">Agregar producto</a>
    <a routerLink="/carrito" routerLinkActive="active">
      Carrito
      <span class="cart-badge" *ngIf="carritoService.cantidadTotal() > 0">
        {{ carritoService.cantidadTotal() }}
      </span>
    </a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>
</header>
