<article class="producto-card" *ngIf="producto">
  <a class="producto-card__link" [routerLink]="['/productos', producto.id]">
    <div class="producto-card__imagen">
      <img [src]="producto.imagen" [alt]="producto.nombre" />
      <span
        class="producto-card__estado"
        [ngClass]="{ disponible: disponible, agotado: !disponible }"
      >
        {{ disponible ? 'Disponible' : 'Agotado' }}
      </span>
    </div>

    <div class="producto-card__contenido">
      <h2>{{ producto.nombre }}</h2>
      <p class="producto-card__meta">
        {{ producto.categoria }} · {{ producto.marca }}
      </p>
      <p class="producto-card__descripcion">{{ producto.descripcion }}</p>
      <div class="producto-card__detalles">
        <span class="producto-card__precio">
          {{ producto.precio | currency:'MXN':'symbol':'1.2-2' }}
        </span>
        <span class="producto-card__stock">
          Stock: <strong>{{ producto.stock }}</strong>
        </span>
      </div>
    </div>
  </a>

  <div class="producto-card__acciones">
    <button type="button" [disabled]="!disponible" (click)="agregarAlCarrito($event)">
      {{ disponible ? 'Agregar al carrito' : 'Sin stock' }}
    </button>
    <span *ngIf="obtenerCantidadEnCarrito() > 0" class="producto-card__cantidad">
      En carrito: {{ obtenerCantidadEnCarrito() }}
    </span>
  </div>
</article>
